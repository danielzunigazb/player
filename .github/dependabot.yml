# Keeps dependencies current without anyone watching, in bundles that can be reviewed and merged
# on their own. Each PR runs the Android CI (tests + lint); merging publishes a dev build.
# Major jumps of the build toolchain (AGP) and the showcase's tools are left for a deliberate
# upgrade PR: they change how the project builds, not just a version number.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Kotlin, its Compose plugin and KSP only work in matching versions.
      kotlin-toolchain:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
      androidx:
        patterns: ["androidx.*"]
        update-types: [minor, patch]
      testing:
        patterns: ["org.robolectric*", "junit*", "org.jetbrains.kotlinx:kotlinx-coroutines-test"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 4

  - package-ecosystem: npm
    directory: /player-showcase
    schedule:
      interval: weekly
      day: monday
    groups:
      showcase:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
