name: Site

# Publishes site/ to GitHub Pages (player.danzuniga.xyz) with the version, test count and app
# screenshots of the latest stable release, and the showcase video. Rebuilds when the site
# changes, and after a new release or a re-rendered showcase so the download link and the video
# stay current. What's on main but not released yet never reaches the site.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Release", "Showcase video"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # site/ comes from main, but what describes the app (version, test count, screenshots and
      # thumbnail) comes from the latest stable release: main may already hold what isn't out yet.
      - name: Take the app's details from the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName) || TAG=""
          if [ -z "$TAG" ]; then echo "::error::No stable release to publish the site from"; exit 1; fi
          echo "latest stable release: $TAG"
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          # Clear the folders first: files added on main since the release must not count.
          rm -rf app/src/test player-showcase/public/img
          git checkout "$TAG" -- app/build.gradle.kts app/src/test player-showcase/public/img docs/showcase-thumb.jpg

      - name: Assemble the site
        run: site/build.sh "$GITHUB_WORKSPACE/_site"

      - name: Pairing links are verifiable
        run: test -f _site/.well-known/assetlinks.json

      - name: Add the showcase video
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download showcase-v1 -p PlayerShowcase.mp4 -p showcase-thumb.jpg -D _site/media --clobber

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
          # .well-known/assetlinks.json lets Player open the monitor's pairing links.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
