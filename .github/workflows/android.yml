name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A PR that changes the version must be releasable as-is: a higher versionCode (Android
      # refuses to install a lower or equal one over the current app) and release notes, which
      # become the release page, the video's "Novedades" and the changelog.
      - name: Version bump is complete
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          read_gradle() { git show "$1:app/build.gradle.kts" | sed -n "s/.*$2 = \"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" | head -1; }
          OLD_NAME=$(read_gradle "$BASE" versionName); NEW_NAME=$(read_gradle HEAD versionName)
          OLD_CODE=$(read_gradle "$BASE" versionCode); NEW_CODE=$(read_gradle HEAD versionCode)
          echo "versionName $OLD_NAME → $NEW_NAME · versionCode $OLD_CODE → $NEW_CODE"
          if [ "$OLD_NAME" = "$NEW_NAME" ]; then echo "Version unchanged: nothing to check."; exit 0; fi
          FAIL=0
          if [ "$NEW_CODE" -le "$OLD_CODE" ]; then
            echo "::error file=app/build.gradle.kts::versionName changed but versionCode didn't go up ($OLD_CODE → $NEW_CODE)"; FAIL=1
          fi
          if [ ! -s "docs/releases/v$NEW_NAME.md" ]; then
            echo "::error::Missing release notes docs/releases/v$NEW_NAME.md"; FAIL=1
          fi
          exit $FAIL

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The release key lives in repo secrets (base64 keystore + passwords) and only a push to
      # main uses it. Branches, PRs and forks build with the debug key: the repo is public, and
      # its artifacts must never hold a release-signed build of code that isn't merged.
      - name: Restore release key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.PLAYER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PLAYER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key in secrets; the APK will be debug-signed."
          fi

      # Without the keystore file Gradle signs with the debug key; the passwords only go to main.
      - name: Test, lint and build
        env:
          PLAYER_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PLAYER_KEYSTORE_PASSWORD || '' }}
          PLAYER_KEY_ALIAS: player
          PLAYER_KEY_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PLAYER_KEY_PASSWORD || '' }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --console=plain

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "DN|SHA-256"

      # Release-signed only on main, debug-signed elsewhere. Kept a few days: the real downloads
      # are the releases, this is just for trying a build.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: player-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports
