name: Release

# Publishes a version: tests, lint and a release build signed with the release key, checked
# against the known certificate, attached to a GitHub release. Two ways in:
# - push a tag like v1.4.2, or
# - run it by hand from Actions on main: it reads versionName and creates the tag itself.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Certificate every installed Player build is signed with; a different one could not update them.
  EXPECTED_CERT_SHA256: 8d7449ce0513e75468cf03b8845420ea7cc6f767dad064934c1e61b4f23cf36c

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Manual releases only run from main"; exit 1
            fi
            if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "::error::v$VERSION is already released; bump versionName first"; exit 1
            fi
          elif [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Restore release key
        env:
          KEYSTORE_B64: ${{ secrets.PLAYER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::PLAYER_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PLAYER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        env:
          PLAYER_REQUIRE_RELEASE_KEY: "true"
          PLAYER_KEYSTORE_PASSWORD: ${{ secrets.PLAYER_KEYSTORE_PASSWORD }}
          PLAYER_KEY_ALIAS: player
          PLAYER_KEY_PASSWORD: ${{ secrets.PLAYER_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --console=plain

      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "certificate: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with an unexpected certificate"; exit 1
          fi
          cp "$APK" "Player-$VERSION.apk"
          sha256sum "Player-$VERSION.apk" > "Player-$VERSION.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/$TAG.md"
          if [ -f "$NOTES" ]; then NOTES_ARGS=(--notes-file "$NOTES"); else NOTES_ARGS=(--generate-notes); fi
          # --target creates the tag at this commit when the run was started by hand.
          gh release create "$TAG" "Player-$VERSION.apk" "Player-$VERSION.apk.sha256" \
            --target "$GITHUB_SHA" --title "Player $VERSION" --latest "${NOTES_ARGS[@]}"
