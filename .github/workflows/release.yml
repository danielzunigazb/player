name: Release

# Publishes Player on its own; nobody has to remember to cut a release:
# - stable: when main carries a versionName that has no release yet (bump versionName in a PR,
#   merge, done), or when a tag like v1.5.0 is pushed. Becomes the "latest" release, which the
#   app's update check and the website offer.
# - dev: every other push to main rebuilds the rolling "dev" prerelease ("1.5.0-dev.<run>"),
#   for trying what's on main before it's a version.
# Both are tested, linted, signed with the release key and checked against its certificate.
# A stable release also carries CHANGELOG.md, generated by scripts/changelog.py. The commit log
# (scripts/historial.py) is for the owner only and is never published.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Certificate every installed Player build is signed with; a different one could not update them.
  EXPECTED_CERT_SHA256: 8d7449ce0513e75468cf03b8845420ea7cc6f767dad064934c1e61b4f23cf36c
  DEV_TAG: dev

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The full history: the changelog dates each version by the commit that added its notes.
          fetch-depth: 0
          # Nothing here pushes: releases go through the API (gh, with GH_TOKEN).
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Decide stable or dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION"; exit 1
            fi
            # A tag publishes what main has, never a commit that wasn't merged.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME points to a commit that isn't on main"; exit 1
            fi
            CHANNEL=stable
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases only come from main"; exit 1
          elif gh release view "v$VERSION" >/dev/null 2>&1; then
            CHANNEL=dev
          else
            CHANNEL=stable
          fi
          if [ "$CHANNEL" = dev ]; then
            SUFFIX="-dev.$GITHUB_RUN_NUMBER"
          else
            SUFFIX=""
          fi
          echo "channel: $CHANNEL · version: $VERSION$SUFFIX"
          {
            echo "CHANNEL=$CHANNEL"
            echo "VERSION=$VERSION"
            echo "FULL_VERSION=$VERSION$SUFFIX"
            echo "PLAYER_VERSION_SUFFIX=$SUFFIX"
          } >> "$GITHUB_ENV"

      - name: Restore release key
        env:
          KEYSTORE_B64: ${{ secrets.PLAYER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::PLAYER_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PLAYER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        env:
          PLAYER_REQUIRE_RELEASE_KEY: "true"
          PLAYER_KEYSTORE_PASSWORD: ${{ secrets.PLAYER_KEYSTORE_PASSWORD }}
          PLAYER_KEY_ALIAS: player
          PLAYER_KEY_PASSWORD: ${{ secrets.PLAYER_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --console=plain

      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "certificate: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with an unexpected certificate"; exit 1
          fi
          # Dev builds keep one file name, so a link to it never goes stale.
          if [ "$CHANNEL" = dev ]; then NAME="Player-dev.apk"; else NAME="Player-$VERSION.apk"; fi
          cp "$APK" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      # The commit log was attached to releases by mistake: take it off wherever it is and put
      # back the 1.5.1 notes without it. Idempotent, safe to remove once it has run.
      - name: Remove the commit log from published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx "HISTORIAL-COMMITS.md"; then
              gh release delete-asset "$tag" HISTORIAL-COMMITS.md --yes && echo "removed from $tag"
            fi
          done
          gh release edit v1.5.1 --notes-file docs/releases/v1.5.1.md

      - name: Publish stable release
        if: env.CHANNEL == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          NOTES="docs/releases/$TAG.md"
          # The notes are the release page, the video's news and the changelog: no notes, no release.
          if [ ! -s "$NOTES" ]; then echo "::error::Missing release notes $NOTES"; exit 1; fi
          # The changelog (all release notes) travels with each version.
          python3 scripts/changelog.py CHANGELOG.md
          gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" CHANGELOG.md \
            --target "$GITHUB_SHA" --title "Player $VERSION" --latest --notes-file "$NOTES"
          # A dev build older than this stable one would only confuse; the next push to main
          # starts a new one.
          gh release delete "$DEV_TAG" --cleanup-tag --yes 2>/dev/null || true

      - name: Publish dev build
        if: env.CHANNEL == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=${GITHUB_SHA::7}
          SUBJECT=$(git log -1 --format=%s)
          cat > dev-notes.md <<NOTES
          **Build de desarrollo** de \`main\` ($SHORT): lo último, antes de ser versión estable. Puede tener fallos.

          Último cambio: $SUBJECT

          Se instala encima de la estable (misma firma). La app solo avisa de versiones estables.
          NOTES
          # One rolling prerelease: replace the previous build and move the tag to this commit.
          gh release delete "$DEV_TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$DEV_TAG" "$APK_NAME" "$APK_NAME.sha256" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Player $FULL_VERSION" --notes-file dev-notes.md
